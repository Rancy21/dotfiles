# Python Language Config
# =======================================
[language-server.ty]
command = "ty"
args = ["server"]

[[language]]
name = "python"
language-servers = ["ty"]
formatter = { command = "ruff", args = ["format", "-"] }
auto-format = true

# Golang Language config
# =======================================
[[language]]
name = "go"
auto-format = true

[language-server.gopls.config]
"formatting.gofumpt" = true


# C/C++ Language config
# =======================================
[[language]]
name = "c"
auto-format = true

[[language]]
name = "cpp"
auto-format = true

[language-server.clangd]
args = ["--fallback-style=Google", "--clang-tidy"]

# Typescript/Javascript
# ========================================

[[language]]
name = "typescript"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "typescript"] }

[[language]]
name = "tsx"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "typescript"] }

[[language]]
name = "javascript"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "typescript"] }

[[language]]
name = "jsx"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "typescript"] }

# HTMl/CSS
# ==============================================
[[language]]
name = "html"
auto-format = true
language-servers = ["vscode-html-language-server"]

[[language]]
name = "css"
auto-format = true
language-servers = ["vscode-css-language-server"]

[language-server.vscode-html-language-server]
command = "vscode-html-language-server"
args = ["--stdio"]

[language-server.vscode-css-language-server]
command = "vscode-css-language-server"
args = ["--stdio"]

[[language]]
name = "html"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "html"] }

[[language]]
name = "css"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "css"] }

# JSON
# ================================================
[[language]]
name = "json"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "json"] }

# YAML
# =================================================
[[language]]
name = "yaml"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "yaml"] }


# ZIG Language Server
# ======================================================
[[language]]
name = "zig"
auto-format = true
formatter = { command = "zig", args = ["fmt", "--stdin"] }
